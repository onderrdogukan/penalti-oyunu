<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penaltı Oyunu</title>
<style>
html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    font-family: Arial, sans-serif;
}
body {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: stretch;
}
.game-container {
    flex: 3;
    position: relative;
    background-image: url('https://st4.depositphotos.com/1013599/30840/v/1600/depositphotos_308408490-stock-illustration-soccer-goalpost-with-net-association.jpg');
    background-size: cover;
    background-position: center bottom;
    border: 2px solid #5f0052;
    overflow: hidden;
    height: 100vh;
}
#keeper {
    position: absolute;
    bottom: 200px;
    left: 50%;
    width: 100px; height: 100px;
    background-image: url('https://e7.pngegg.com/pngimages/12/619/png-clipart-goal-keeper-catches-ball-graphic-art-football-player-football-player-silhouette-hand-sport-thumbnail.png');
    background-size: cover;
    background-position: center;
    transform: translateX(-50%);
    transition: transform 0.5s ease-out;
    z-index: 2;
}
#ball {
    position: absolute;
    bottom: 100px;
    left: 50%;
    width: 100px; height: 100px;
    background-image: url('https://cdn-icons-png.flaticon.com/512/53/53283.png');
    background-size: cover;
    transform: translateX(-50%);
    transition: transform 0.8s ease-in-out;
    z-index: 1;
}
.info-panel {
    position: absolute;
    bottom: 1px;
    left: 50%;
    transform: translateX(-50%);
    background-color: rgba(0,0,0,0.8);
    padding: 10px;
    border-radius: 500px;
    text-align: center;
    width: 97%;
    color: #fff;
}
.options button, #reset-button {
    padding: 10px 15px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
    background-color: #4caf50;
    color: #fff;
    border: none;
    border-radius: 5px;
    transition: background-color 0.3s;
}
.options button:hover, #reset-button:hover { background-color: #388e3c; }
#reset-button { background-color: #2196f3; }
#reset-button:hover { background-color: #1976d2; }

/* Sağ skorboard */
.scoreboard {
    flex: 1;
    height: 100vh;
    margin: 0;
    padding: 20px;
    background-color: rgba(0,0,0,0.85);
    color: #fff;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
}
#game-result {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    font-weight: bold;
    color: #ffeb3b;
    text-shadow: 2px 2px 5px #000;
}
.scoreboard h2 { color: #ffeb3b; margin-bottom: 20px; }
.scoreboard p { font-size: 18px; margin: 10px 0; }
/* Skor çubukları */
.score-bar-container {
    width: 100%;
    height: 20px;
    background-color: rgba(255,255,255,0.2);
    border-radius: 10px;
    margin-bottom: 15px;
    overflow: hidden;
}
.score-bar {
    height: 100%;
    width: 0%;
    background-color: #4caf50;
    border-radius: 10px;
    transition: width 0.5s ease;
}
.red-bar { background-color: #f44336; }

/* Atış sayısı seçimi */
#shot-selection {
    text-align: center;
    margin-bottom: 10px;
}
#shot-selection button {
    padding: 10px 20px;
    margin: 0 5px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
    border: none;
    background-color: #ff9800;
    color: #fff;
    transition: background-color 0.3s;
}
#shot-selection button:hover { background-color: #fb8c00; }

</style>
</head>
<body>

<div class="game-container">
    <div id="keeper"></div>
    <div id="ball"></div>
    <div class="info-panel">
        <div id="shot-selection">
            <p>Kaç atışlık oyun oynamak istersin?</p>
            <button onclick="startGame(3)">3 Atış</button>
            <button onclick="startGame(5)">5 Atış</button>
            <button onclick="startGame(10)">10 Atış</button>
        </div>
        <p id="message"></p>
        <div class="options" style="display:none;">
            <button onclick="makeShot('solUst')">Sol Üst</button>
            <button onclick="makeShot('solAlt')">Sol Alt</button>
            <button onclick="makeShot('orta')">Orta</button>    
            <button onclick="makeShot('sagAlt')">Sağ Alt</button>
            <button onclick="makeShot('sagUst')">Sağ Üst</button>
        </div>
    </div>
</div>

<div class="scoreboard">
    <div id="game-result"></div>
    <h2>Skorboard</h2>
    <p>Oyuncu Skor: <span id="player-score">0</span></p>
    <div class="score-bar-container">
        <div id="player-bar" class="score-bar"></div>
    </div>
    <p>Kaleci Skor: <span id="keeper-score">0</span></p>
    <div class="score-bar-container">
        <div id="keeper-bar" class="score-bar red-bar"></div>
    </div>
    <button id="reset-button" onclick="resetGame()" style="display:none;">Tekrar Oyna</button>
</div>

<audio id="sound-goal" src="https://www.zedge.net/ringtones/e1c087af-02b0-4ca1-8969-94234a587465"></audio>
<audio id="sound-save" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
<audio id="sound-kick" src="https://actions.google.com/sounds/v1/foley/wood_single_hit.ogg"></audio>

<script>
const positions=['solUst','sagUst','solAlt','sagAlt','orta'];
let playerScore=0, keeperScore=0, isGameActive=false, shotCount=0, maxShots=5;
const msg=document.getElementById('message');
const playerScoreEl=document.getElementById('player-score');
const keeperScoreEl=document.getElementById('keeper-score');
const keeper=document.getElementById('keeper');
const ball=document.getElementById('ball');
const buttons=document.querySelectorAll('.options button');
const resetBtn=document.getElementById('reset-button');
const saveSound=document.getElementById('sound-save');
const kickSound=document.getElementById('sound-kick');
const goalSound = document.getElementById('sound-goal');
const gameResultEl = document.getElementById('game-result');
const shotSelection = document.getElementById('shot-selection');
const optionsDiv = document.querySelector('.options');

function startGame(shots){
    maxShots = shots;       // Seçilen atış sayısını ayarla
    shotCount = 0;          // Atış sayacı sıfırla
    playerScore = 0;
    keeperScore = 0;
    isGameActive = true;    // Oyunu aktif et
    playerScoreEl.textContent='0';
    keeperScoreEl.textContent='0';
    gameResultEl.textContent='';
    msg.textContent='Atış yapmak için bir köşe seçin!';
    shotSelection.style.display='none'; // seçim panelini gizle
    optionsDiv.style.display='block';   // atış butonlarını göster
    resetBtn.style.display='none';      // tekrar oyna butonunu gizle
    updateScoreBars();
}


function updateScoreBars(){
    const total = Math.max(playerScore + keeperScore, 1);
    document.getElementById('player-bar').style.width = (playerScore/total*100) + '%';
    document.getElementById('keeper-bar').style.width = (keeperScore/total*100) + '%';
}

function getKeeperMove(playerMove){
    const r=Math.random();
    return r<0.4?playerMove:positions[Math.floor(Math.random()*positions.length)];
}

function makeShot(playerMove){
    if(!isGameActive) return;
    buttons.forEach(b=>b.disabled=true);
    msg.textContent='Atış yapılıyor...';
    kickSound.play();

    const keeperMove=getKeeperMove(playerMove);
    moveKeeper(keeperMove);
    moveBall(playerMove);

    setTimeout(()=>{
        calculateResult(playerMove, keeperMove);
        shotCount++;
        if(shotCount >= maxShots) endGame();
        setTimeout(()=>{
            ball.style.transform='translateX(-50%) translateY(0)';
            keeper.style.transform='translateX(-50%) translateY(0)';
            if(isGameActive){
                buttons.forEach(b=>b.disabled=false);
                msg.textContent='Yeni atış yapmak için bir köşe seçin!';
            }
        },1000);
    },800);
}

function moveKeeper(pos){
    let x=0,y=0;
    switch(pos){
        case 'solUst': x=-240; y=-260; break;
        case 'sagUst': x=240; y=-260; break;
        case 'solAlt': x=-240; y=25; break;
        case 'sagAlt': x=240; y=-25; break;
        case 'orta': x=0; y=-260; break;
    }
    keeper.style.transform=`translateX(${x}px) translateY(${y}px)`;
}

function moveBall(pos){
    let x=0,y=-200;
    switch(pos){
        case 'solUst': x=-240; y=-360; break;
        case 'sagUst': x=240; y=-360; break;
        case 'solAlt': x=-240; y=-100; break;
        case 'sagAlt': x=240; y=-100; break;
        case 'orta': x=0; y=-360; break;
    }
    ball.style.transform=`translateX(${x}px) translateY(${y}px)`;
}

function calculateResult(playerMove, keeperMove){
    const positionNames = {
        solUst: 'sol üst köşeye',
        sagUst: 'sağ üst köşeye',
        solAlt: 'sol alt köşeye',
        sagAlt: 'sağ alt köşeye',
        orta: 'ortaya'
    };

    let res = `Oyuncu ${positionNames[playerMove]} vurdu, kaleci ${positionNames[keeperMove]} atladı. `;

    if(playerMove === keeperMove){
        keeperScore++;
        saveSound.play();
        res += '❌ KURTARIŞ!';
    } else {
        playerScore++;
        goalSound.play();
        res += '⚽ GOL!';
    }

    playerScoreEl.textContent = playerScore;
    keeperScoreEl.textContent = keeperScore;
    updateScoreBars();
    msg.textContent = res;
}

function endGame(){
    isGameActive=false;
    let final='OYUN BİTTİ!! ';
    if(playerScore>keeperScore) final+='🏆 Kazandın!';
    else if(keeperScore>playerScore) final+='😢 Kaybettin!';
    else final+='🤝 Berabere!';
    gameResultEl.textContent = final;
    resetBtn.style.display='block';
}

function resetGame(){
    shotSelection.style.display='block';
    optionsDiv.style.display='none';
    msg.textContent='';
    gameResultEl.textContent='';
    keeper.style.transform='translateX(-50%) translateY(0)';
    ball.style.transform='translateX(-50%) translateY(0)';
}
</script>

</body>
</html>
